<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistral Vibe · Token Plan</title>
<style>
  :root {
    --bg: #16181d; --card: #1e2127; --line: #2b2f38; --text: #e6e8ee;
    --muted: #8b93a5; --accent: #f97316; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --card: #fff; --line: #e3e6ec; --text: #1b1e25; --muted: #5c6474; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .metric { display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
  .metric .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .metric .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #10131a; font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--text); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .stat.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .stat.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .stat.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad > i { background: var(--bad); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Mistral Vibe · Token Plan</h1>
    <p class="sub">连接后 Mistral 会以 OpenAI 兼容条目的形式出现在「AI 提供商」里，调用由 CPA 原生转发。</p>
  </div>

  <div class="card" id="connect">
    <div class="grid2">
      <div>
        <label for="planKey">API Key</label>
        <input id="planKey" type="password" placeholder="粘贴你的 Mistral API Key" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" style="width:100%" value="https://api.mistral.ai" spellcheck="false">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="connectBtn">添加到 AI 提供商</button>
      <button class="ghost" id="balanceBtn">查余额</button>
      <span id="status" class="sub"></span>
    </div>
    <div id="result" class="stat" style="display:none;margin-top:12px"></div>
  </div>

  <div class="card" id="balanceCard">
    <div class="row" style="justify-content:space-between">
      <div class="metric"><span class="v" id="planName">—</span><span class="k">计划</span></div>
      <div class="metric"><span class="v" id="remain">—</span><span class="k">本月剩余</span></div>
      <div class="metric"><span class="v" id="spent">—</span><span class="k">已用</span></div>
      <div class="metric"><span class="v" id="resetAt">—</span><span class="k">重置时间</span></div>
    </div>
    <div style="margin-top:14px">
      <div class="bar" id="usageBar"><i style="width:0%"></i></div>
      <div id="windows" class="sub" style="margin-top:8px"></div>
    </div>
    <details>
      <summary>这个条目长什么样</summary>
      <pre id="entryPreview" class="sub" style="white-space:pre-wrap"></pre>
    </details>
  </div>
</div>

<script>
const MANAGEMENT_KEY_HEADER = 'X-Management-Key';
// The panel reuses its own session; the page reads the same storage keys the
// CPA management center writes, and falls back to an input when absent.
function managementKey() {
  for (const store of [localStorage, sessionStorage]) {
    for (const key of ['managementKey', 'cli-proxy-auth', 'cpamc.management_key']) {
      const raw = store.getItem(key);
      if (!raw) continue;
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'string' && parsed) return parsed;
        if (parsed && typeof parsed === 'object') {
          if (parsed.managementKey) return parsed.managementKey;
          if (parsed.key) return parsed.key;
          if (parsed.token) return parsed.token;
        }
      } catch (_) {
        if (raw.trim()) return raw.trim();
      }
    }
  }
  return '';
}

const apiBase = (() => {
  // Resource routes live under /v0/resource/plugins/<id>/; management lives at /v0/management.
  const path = location.pathname;
  const index = path.indexOf('/v0/resource/plugins/');
  return index >= 0 ? path.slice(0, index) : '';
})();

function managementURL(suffix) {
  return apiBase + '/v0/management/mistral-vibe/' + suffix;
}

function headers(withKey) {
  const out = { 'Content-Type': 'application/json' };
  if (withKey) {
    out[MANAGEMENT_KEY_HEADER] = withKey;
    out.Authorization = 'Bearer ' + withKey;
  }
  return out;
}

const $ = (id) => document.getElementById(id);
const status = (text, kind) => { $('status').textContent = text; $('status').style.color = kind === 'bad' ? 'var(--bad)' : ''; };

async function connect() {
  const key = $('planKey').value.trim();
  const base = $('baseUrl').value.trim() || 'https://api.mistral.ai';
  if (!key) return status('先填 API Key', 'bad');
  const mk = managementKey();
  if (!mk) return status('需要在 CPA 管理面板里打开本页（找不到管理密钥）', 'bad');
  $('connectBtn').disabled = true;
  status('正在写入 AI 提供商…');
  try {
    const resp = await fetch(managementURL('connect'), {
      method: 'POST',
      headers: headers(mk),
      body: JSON.stringify({ plan_key: key, api_key: key, base_url: base }),
    });
    const data = await resp.json();
    const box = $('result');
    box.style.display = 'block';
    if (!resp.ok) {
      box.className = 'stat bad';
      box.textContent = data.error || ('失败：HTTP ' + resp.status);
      status('');
      return;
    }
    const p = data.provider;
    box.className = 'stat ok';
    box.innerHTML = (p.created ? '已添加' : '已更新') + '「' + p.name + '」，Base URL <code>' +
      p.base_url + '</code>，模型 ' + p.models.map(m => '<code>' + m + '</code>').join(' ') +
      '。刷新「AI 提供商」页即可看到。';
    status('');
    $('entryPreview').textContent = JSON.stringify({
      name: p.name,
      'base-url': p.base_url,
      'api-key-entries': [{ 'api-key': '••••' + key.slice(-4) }],
      models: p.models.map((m) => ({ name: m, alias: m })),
    }, null, 2);
  } catch (err) {
    status('请求失败：' + err.message, 'bad');
  } finally {
    $('connectBtn').disabled = false;
  }
}

async function loadBalance() {
  const key = $('planKey').value.trim();
  if (!key) return status('先填 API Key', 'bad');
  const mk = managementKey();
  if (!mk) return status('需要在 CPA 管理面板里打开本页', 'bad');
  status('读取中…');
  try {
    const url = managementURL('balance') + '?plan_key=' + encodeURIComponent(key) +
      '&base_url=' + encodeURIComponent($('baseUrl').value.trim() || 'https://api.mistral.ai');
    const resp = await fetch(url, { headers: headers(mk) });
    const data = await resp.json();
    if (!resp.ok) return status(data.error || ('失败：HTTP ' + resp.status), 'bad');
    status('');
    $('planName').textContent = data.plan || '—';
    if (typeof data.balance === 'number') {
      $('remain').textContent = data.balance.toFixed(2) + ' ' + (data.currency || '');
      $('spent').textContent = (data.spent || 0).toFixed(2) + (data.limit ? ' / ' + data.limit : '');
      const pct = data.limit ? Math.min(100, (data.spent / data.limit) * 100) : 0;
      const bar = $('usageBar');
      bar.className = 'bar' + (pct >= 90 ? ' bad' : pct >= 75 ? ' warn' : '');
      bar.querySelector('i').style.width = pct.toFixed(1) + '%';
    } else {
      $('remain').textContent = '未上报';
    }
    $('resetAt').textContent = data.reset_at ? data.reset_at.slice(0, 10) : '—';
    $('windows').textContent = (data.windows || [])
      .map((w) => w.window + ' · 剩余 ' + Math.round(w.remaining * 100) + '%').join('　');
  } catch (err) {
    status('请求失败：' + err.message, 'bad');
  }
}

$('connectBtn').addEventListener('click', connect);
$('balanceBtn').addEventListener('click', loadBalance);
</script>
</body>
</html>
