<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistral Vibe · Token Plan</title>
<style>
  :root {
    --bg: #16181d; --card: #1e2127; --line: #2b2f38; --text: #e6e8ee;
    --muted: #8b93a5; --accent: #f97316; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --card: #fff; --line: #e3e6ec; --text: #1b1e25; --muted: #5c6474; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .metric { display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
  .metric .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .metric .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #10131a; font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--text); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .stat.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .stat.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .stat.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad > i { background: var(--bad); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Mistral Vibe · Token Plan</h1>
    <p class="sub">{{keyHint}}，不需要在这里再填一次。</p>
  </div>

  <div class="card" id="balanceCard">
    <div class="row" style="justify-content:space-between">
      <div class="metric"><span class="v">{{plan}}</span><span class="k">计划</span></div>
      <div class="metric"><span class="v">{{remain}}</span><span class="k">本月剩余</span></div>
      <div class="metric"><span class="v">{{spent}}</span><span class="k">已用</span></div>
      <div class="metric"><span class="v">{{reset}}</span><span class="k">重置时间</span></div>
    </div>
    <div style="margin-top:14px">
      <div class="bar{{barTone}}" id="usageBar"><i style="width:{{barPct}}%"></i></div>
      <div id="windows" class="sub" style="margin-top:8px">{{windows}}</div>
    </div>
    {{note}}
    <div class="row" style="margin-top:12px">
      <button class="ghost" onclick="location.reload()">刷新</button>
    </div>
  </div>

  <div class="card">
    <details id="connectBox">
      <summary>换一个 key，或手动添加到 AI 提供商</summary>
      <p class="sub" style="margin-top:10px">
        配置里的 key 会在 CPA 启动时自动写入 AI 提供商。只有想临时用别的 key 时才需要这里；
        写进 AI 提供商需要 CPA 的管理密钥。
      </p>
      <div class="grid2" style="margin-top:10px">
        <div>
          <label for="planKey">API Key</label>
          <input id="planKey" type="password" placeholder="留空则使用配置里的 key" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="baseUrl">Base URL</label>
          <input id="baseUrl" value="https://api.mistral.ai" spellcheck="false">
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <input id="mgmtKey" type="password" placeholder="CPA 管理密钥（仅写入时需要）" autocomplete="off" spellcheck="false" style="flex:1;min-width:220px">
        <button id="connectBtn">添加到 AI 提供商</button>
      </div>
      <div id="result" class="stat" style="display:none;margin-top:12px"></div>
    </details>
  </div>
</div>

<script>
// Only the optional "replace the key" form needs script; the balance is rendered
// server-side because a resource page has no management authentication.
const $ = (id) => document.getElementById(id);
const setStatus = (text, kind) => {
  const el = $('status');
  if (!el) return;
  el.textContent = text || '';
  el.style.color = kind === 'bad' ? 'var(--bad)' : '';
};

async function connect() {
  const key = $('planKey').value.trim();
  const base = $('baseUrl').value.trim() || 'https://api.mistral.ai';
  const mgmt = $('mgmtKey').value.trim();
  if (!key) return setStatus('先填要换成的 key', 'bad');
  if (!mgmt) return setStatus('写进 AI 提供商需要 CPA 管理密钥（这一步会改 CPA 配置）', 'bad');
  $('connectBtn').disabled = true;
  setStatus('正在写入 AI 提供商…');
  try {
    const resp = await fetch('{{mgmtURL}}connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Management-Key': mgmt, Authorization: 'Bearer ' + mgmt },
      body: JSON.stringify({ plan_key: key, api_key: key, base_url: base }),
    });
    const data = await resp.json();
    const box = $('result');
    box.style.display = 'block';
    if (!resp.ok) {
      box.className = 'stat bad';
      box.textContent = data.error || ('失败：HTTP ' + resp.status);
      return setStatus('');
    }
    const p = data.provider;
    box.className = 'stat ok';
    box.innerHTML = (p.created ? '已添加' : '已更新') + '「' + p.name + '」，' + p.models.length + ' 个模型。<br>刷新「AI 提供商」页即可看到。';
    setStatus('');
  } catch (err) {
    setStatus('请求失败：' + err.message, 'bad');
  } finally {
    $('connectBtn').disabled = false;
  }
}
$('connectBtn').addEventListener('click', connect);
</script>
</body>
</html>
